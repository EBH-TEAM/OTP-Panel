<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBH SMS - Cloud Sync Mini App & API Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060913; color: #f8fafc; }
        .glass-panel { background: rgba(20, 28, 46, 0.92); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.12); }

        .c-blue { background: linear-gradient(135deg, #1d4ed8, #3b82f6); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35); }
        .c-green { background: linear-gradient(135deg, #047857, #10b981); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35); }
        .c-sky { background: linear-gradient(135deg, #0284c7, #38bdf8); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35); }
        .c-purple { background: linear-gradient(135deg, #6d28d9, #8b5cf6); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35); }
        .c-rose { background: linear-gradient(135deg, #be123c, #f43f5e); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35); }
        .c-amber { background: linear-gradient(135deg, #b45309, #f59e0b); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
        .c-teal { background: linear-gradient(135deg, #0f766e, #14b8a6); box-shadow: 0 4px 12px rgba(20, 184, 166, 0.35); }
        
        .c-next-btn {
            background: linear-gradient(135deg, #e11d48 0%, #f97316 50%, #db2777 100%);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] hidden px-4 py-2 rounded-full c-green text-white text-xs font-bold shadow-2xl transition-all">
        Copied!
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-[#060913] flex flex-col items-center justify-center p-4 hidden">
        <div class="w-full max-w-sm glass-panel rounded-3xl p-6 space-y-5 shadow-2xl border border-blue-500/30">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 c-blue rounded-2xl mx-auto flex items-center justify-center text-2xl text-white shadow-lg">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <h2 class="text-lg font-extrabold text-white">TELEGRAM CLOUD LOGIN</h2>
                <p class="text-xs text-slate-400">যেকোনো ব্রাউজারে আপনার হিস্ট্রি ও API সিংক করতে টেলিগ্রাম Chat ID দিন।</p>
            </div>
            <div id="loginStep1" class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-slate-300 block mb-1">Telegram Chat ID:</label>
                    <input type="number" id="loginChatId" placeholder="e.g. 6140196943" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="sendLoginOtp()" id="sendCodeBtn" class="w-full py-3 c-blue active:scale-95 rounded-xl font-extrabold text-xs text-white transition-all">
                    SEND VERIFICATION CODE
                </button>
            </div>
            <div id="loginStep2" class="space-y-3 hidden">
                <div>
                    <label class="text-[11px] font-bold text-emerald-400 block mb-1">Enter 6-Digit Code from Telegram:</label>
                    <input type="number" id="loginOtpInput" placeholder="123456" class="w-full bg-slate-900 border border-emerald-600 rounded-xl p-3 text-center text-lg tracking-widest text-white font-mono focus:outline-none">
                </div>
                <button onclick="verifyLoginOtp()" class="w-full py-3 c-green active:scale-95 rounded-xl font-extrabold text-xs text-white transition-all">
                    VERIFY & SYNC CLOUD
                </button>
                <button onclick="resetLoginStep()" class="w-full py-2 text-[11px] text-slate-400 hover:text-white">Change Chat ID</button>
            </div>
        </div>
    </div>

    <!-- User Header with Clickable Profile & Prominent MY OTP Button -->
    <header id="userHeader" class="w-full max-w-md mx-auto p-3 pb-1 hidden z-20 flex-shrink-0">
        <div class="glass-panel rounded-2xl p-3.5 flex items-center justify-between shadow-lg">
            <!-- Clickable Profile Area -->
            <div onclick="renderUserProfileView()" class="flex items-center space-x-2.5 cursor-pointer group active:scale-95 transition-all" title="View Full Profile & API Docs">
                <div class="relative">
                    <img id="userAvatar" src="https://ui-avatars.com/api/?name=TG&background=2563eb&color=fff" alt="Profile" class="w-10 h-10 rounded-xl object-cover border border-blue-400/50 shadow group-hover:border-amber-400 transition-all">
                    <span class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-[#060913] rounded-full"></span>
                </div>
                <div>
                    <h2 id="userDisplayName" class="text-xs font-extrabold text-white group-hover:text-sky-400 transition-colors flex items-center">
                        <span>Telegram User</span>
                        <i class="fa-solid fa-circle-info text-[10px] text-sky-400 ml-1"></i>
                    </h2>
                    <p class="text-[10px] text-sky-400 font-mono">ID: <span id="userDisplayId">---</span></p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="renderMyOtpView()" class="px-4 py-2 c-amber rounded-2xl text-xs font-black text-white shadow-xl flex items-center space-x-1.5 active:scale-95 transition-all">
                    <i class="fa-solid fa-key text-xs"></i>
                    <span>MY OTP (<span id="otpCountBadge">0</span>)</span>
                </button>
                <button id="logoutBtn" onclick="logoutUser()" class="hidden text-xs c-rose text-white px-2.5 py-2 rounded-xl font-bold" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content Area with Safe Bottom Padding -->
    <main id="screenContainer" class="w-full max-w-md mx-auto flex-1 overflow-y-auto p-3 pb-24 space-y-3 hidden">
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-[#090d1c]/95 backdrop-blur-lg border-t border-slate-800/80 p-2.5 shadow-2xl z-40 hidden">
        <div class="w-full max-w-md mx-auto grid grid-cols-4 gap-1.5">
            <button onclick="renderActiveNumbersView()" class="py-2.5 px-1 c-rose active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-inbox text-xs"></i>
                <span>MY NUMBERS</span>
            </button>
            <button onclick="loadServices()" class="py-2.5 px-1 c-blue active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-phone-volume text-xs"></i>
                <span>GET NUMBER</span>
            </button>
            <button onclick="openCustomRange()" class="py-2.5 px-1 c-purple active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-globe text-xs"></i>
                <span>CUSTOM RANGE</span>
            </button>
            <button onclick="loadLiveTraffic()" class="py-2.5 px-1 c-green active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-wave-square text-xs"></i>
                <span>LIVE TRAFFIC</span>
            </button>
        </div>
    </nav>

    <script>
        // ==================== CONFIGURATION ====================
        const BOT_TOKEN = "8602703011:AAEHSOEXgBmurFtHE-Em3lMXDA997qdRy2k";
        const FIREBASE_DB_URL = "https://otp-4073e-default-rtdb.firebaseio.com";
        
        const API_KEY = "MY19QXBVDP6";
        const API_BASE = "https://api.2oo9.cloud/MXS47FLFX0U/tness/@public/api";
        const BUY_API = `${API_BASE}/getnum`;
        const STATUS_API = `${API_BASE}/success-otp`;
        const CONSOLE_API = `${API_BASE}/console`;

        let currentUser = null;
        let generatedLoginOtp = null;
        let pendingChatId = null;

        // Cloud State synced with Firebase
        let userCloudData = {
            profile: { name: "User", username: "", photo: "", joinedAt: "" },
            stats: { totalNumbersTaken: 0, totalSuccessOtps: 0 },
            apiKey: "",
            activeNumbers: [],
            successOtps: []
        };

        let fetchedConsoleData = [];
        let lastSelectedRange = localStorage.getItem('ebh_last_range') || null;
        let lastSelectedService = localStorage.getItem('ebh_last_service') || 'SMS';

        // ==================== EXTERNAL API GATEWAY HANDLER (URL PARAMS) ====================
        async function handleExternalApiRequest() {
            const params = new URLSearchParams(window.location.search);
            const reqKey = params.get('api_key');
            const action = params.get('action');

            if (!reqKey || !action) return false;

            document.body.innerHTML = `<pre id="apiJsonOutput" style="color:#10b981; background:#060913; padding:16px; font-family:monospace; font-size:13px;">Processing API Request...</pre>`;
            const outputEl = document.getElementById('apiJsonOutput');

            try {
                // Find user by API Key in Firebase
                const usersRes = await fetch(`${FIREBASE_DB_URL}/users.json`);
                const allUsers = await usersRes.json() || {};
                let matchedUserId = null;
                let matchedUserData = null;

                for (const [uid, udata] of Object.entries(allUsers)) {
                    if (udata && udata.apiKey === reqKey) {
                        matchedUserId = uid;
                        matchedUserData = udata;
                        break;
                    }
                }

                if (!matchedUserId) {
                    outputEl.innerText = JSON.stringify({ status: "error", code: 401, message: "Invalid or unauthorized API Key" }, null, 2);
                    return true;
                }

                if (action === "getnum") {
                    const range = params.get('range');
                    if (!range) {
                        outputEl.innerText = JSON.stringify({ status: "error", code: 400, message: "Missing 'range' parameter" }, null, 2);
                        return true;
                    }

                    const response = await fetch(BUY_API, {
                        method: "POST",
                        headers: { "mauthapi": API_KEY, "Content-Type": "application/json" },
                        body: JSON.stringify({ range: range })
                    });
                    const resData = await response.json();

                    if (resData.meta && resData.meta.code === 200) {
                        const num = "+" + (resData.data.full_number || resData.data.national_number).toString().replace("+", "");
                        if (!matchedUserData.stats) matchedUserData.stats = { totalNumbersTaken: 0, totalSuccessOtps: 0 };
                        matchedUserData.stats.totalNumbersTaken = (matchedUserData.stats.totalNumbersTaken || 0) + 1;
                        
                        if (!matchedUserData.activeNumbers) matchedUserData.activeNumbers = [];
                        matchedUserData.activeNumbers.unshift({
                            id: Date.now(),
                            number: num,
                            range: range,
                            service: "API",
                            otp: null,
                            notified: false
                        });

                        await fetch(`${FIREBASE_DB_URL}/users/${matchedUserId}.json`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(matchedUserData)
                        });

                        outputEl.innerText = JSON.stringify({
                            status: "success",
                            code: 200,
                            user_id: matchedUserId,
                            data: { number: num, range: range }
                        }, null, 2);
                    } else {
                        outputEl.innerText = JSON.stringify({ status: "error", code: 404, message: "No numbers available in this range" }, null, 2);
                    }
                    return true;
                }

                if (action === "checkotp") {
                    const targetNum = (params.get('number') || "").replace(/\D/g, "");
                    const [statusRes, consoleRes] = await Promise.all([
                        fetch(STATUS_API, { headers: { "mauthapi": API_KEY, "Accept": "application/json" } }).then(r => r.json()).catch(() => ({})),
                        fetch(CONSOLE_API, { headers: { "mauthapi": API_KEY, "Accept": "application/json" } }).then(r => r.json()).catch(() => ({}))
                    ]);

                    let allSms = [];
                    if (statusRes.data && statusRes.data.otps) allSms = allSms.concat(statusRes.data.otps);
                    if (consoleRes.data && consoleRes.data.hits) allSms = allSms.concat(consoleRes.data.hits);

                    let foundOtp = null;
                    let rawMsg = null;
                    for (const sms of allSms) {
                        let apiNum = sms.number ? sms.number.toString().replace(/\D/g, "") : "";
                        let msg = sms.message || "";
                        let match = msg.match(/\b\d{4,6}\b/);
                        if (match && apiNum && (!targetNum || apiNum.includes(targetNum) || targetNum.includes(apiNum))) {
                            foundOtp = match[0];
                            rawMsg = msg;
                            break;
                        }
                    }

                    if (foundOtp) {
                        outputEl.innerText = JSON.stringify({
                            status: "success",
                            code: 200,
                            data: { number: "+" + targetNum, otp: foundOtp, message: rawMsg }
                        }, null, 2);
                    } else {
                        outputEl.innerText = JSON.stringify({ status: "pending", code: 202, message: "Waiting for OTP..." }, null, 2);
                    }
                    return true;
                }

                if (action === "console") {
                    const response = await fetch(CONSOLE_API, { headers: { "mauthapi": API_KEY, "Accept": "application/json" } });
                    const result = await response.json();
                    const hits = (result.data && result.data.hits) ? result.data.hits.slice(-20).reverse() : [];
                    outputEl.innerText = JSON.stringify({
                        status: "success",
                        code: 200,
                        total_hits: hits.length,
                        data: hits.map(h => ({ range: h.range, service: h.sid || "SMS", message: h.message }))
                    }, null, 2);
                    return true;
                }

                outputEl.innerText = JSON.stringify({ status: "error", code: 400, message: "Invalid action. Use getnum, checkotp, or console." }, null, 2);
                return true;

            } catch (err) {
                outputEl.innerText = JSON.stringify({ status: "error", code: 500, message: err.message }, null, 2);
                return true;
            }
        }

        // ==================== FIREBASE REST API HELPERS ====================
        async function fetchUserFromFirebase(userId) {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/users/${userId}.json`);
                const data = await res.json();
                return data || null;
            } catch (e) {
                console.error("Firebase fetch error:", e);
                return null;
            }
        }

        async function syncUserToFirebase() {
            if (!currentUser || !currentUser.id) return;
            try {
                await fetch(`${FIREBASE_DB_URL}/users/${currentUser.id}.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(userCloudData)
                });
            } catch (e) {
                console.error("Firebase save error:", e);
            }
        }

        async function fetchTelegramProfilePhoto(userId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUserProfilePhotos?user_id=${userId}&limit=1`);
                const data = await res.json();
                if (data.ok && data.result.total_count > 0) {
                    const fileId = data.result.photos[0][0].file_id;
                    const fileRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                    const fileData = await fileRes.json();
                    if (fileData.ok && fileData.result.file_path) {
                        return `https://api.telegram.org/file/bot${BOT_TOKEN}/${fileData.result.file_path}`;
                    }
                }
            } catch (e) {}
            return null;
        }

        // ==================== INITIALIZATION & AUTH ====================
        window.onload = async () => {
            // Check if invoked as an API Endpoint
            const isApiCall = await handleExternalApiRequest();
            if (isApiCall) return;

            const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.ready();
                tg.expand();
                const u = tg.initDataUnsafe.user;
                const fullName = `${u.first_name || ''} ${u.last_name || ''}`.trim() || "Telegram User";
                const username = u.username ? `@${u.username}` : "No Username";
                const photoUrl = u.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=2563eb&color=fff`;

                currentUser = {
                    id: u.id.toString(),
                    name: fullName,
                    username: username,
                    photo: photoUrl,
                    isMiniApp: true
                };
                await initializeCloudSession();
            } else {
                const savedSession = localStorage.getItem('ebh_web_user');
                if (savedSession) {
                    currentUser = JSON.parse(savedSession);
                    await initializeCloudSession();
                } else {
                    document.getElementById('loginScreen').classList.remove('hidden');
                }
            }
        };

        async function initializeCloudSession() {
            const existingCloud = await fetchUserFromFirebase(currentUser.id);
            
            if (existingCloud) {
                userCloudData = {
                    profile: existingCloud.profile || {},
                    stats: existingCloud.stats || { totalNumbersTaken: 0, totalSuccessOtps: 0 },
                    apiKey: existingCloud.apiKey || "",
                    activeNumbers: existingCloud.activeNumbers || [],
                    successOtps: existingCloud.successOtps || []
                };

                if (currentUser.isMiniApp) {
                    userCloudData.profile.name = currentUser.name;
                    userCloudData.profile.username = currentUser.username;
                    if (currentUser.photo && !currentUser.photo.includes('ui-avatars.com')) {
                        userCloudData.profile.photo = currentUser.photo;
                    }
                    await syncUserToFirebase();
                } else {
                    if (userCloudData.profile.name) currentUser.name = userCloudData.profile.name;
                    if (userCloudData.profile.username) currentUser.username = userCloudData.profile.username;
                    if (userCloudData.profile.photo) currentUser.photo = userCloudData.profile.photo;
                }
            } else {
                let fetchedPhoto = currentUser.photo;
                if (!currentUser.isMiniApp) {
                    const tgPic = await fetchTelegramProfilePhoto(currentUser.id);
                    if (tgPic) fetchedPhoto = tgPic;
                }
                currentUser.photo = fetchedPhoto;

                userCloudData = {
                    profile: {
                        name: currentUser.name,
                        username: currentUser.username || "Web User",
                        photo: fetchedPhoto,
                        joinedAt: new Date().toLocaleDateString()
                    },
                    stats: {
                        totalNumbersTaken: 0,
                        totalSuccessOtps: 0
                    },
                    apiKey: "",
                    activeNumbers: [],
                    successOtps: []
                };
                await syncUserToFirebase();
            }

            if (currentUser.photo.includes('ui-avatars.com')) {
                const tgPic = await fetchTelegramProfilePhoto(currentUser.id);
                if (tgPic) {
                    currentUser.photo = tgPic;
                    userCloudData.profile.photo = tgPic;
                    await syncUserToFirebase();
                }
            }

            unlockApp();
        }

        function unlockApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('userHeader').classList.remove('hidden');
            document.getElementById('screenContainer').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');

            document.getElementById('userDisplayName').querySelector('span').innerText = currentUser.name;
            document.getElementById('userDisplayId').innerText = currentUser.id;
            document.getElementById('userAvatar').src = currentUser.photo;

            if (!currentUser.isMiniApp) {
                document.getElementById('logoutBtn').classList.remove('hidden');
            }
            updateOtpBadge();
            renderActiveNumbersView();
        }

        function updateOtpBadge() {
            const count = (userCloudData.successOtps || []).length;
            document.getElementById('otpCountBadge').innerText = count;
        }

        // ==================== TELEGRAM BOT & LOGIN OTP ====================
        async function sendTelegramBotMessage(chatId, htmlText) {
            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: chatId, text: htmlText, parse_mode: "HTML" })
                });
                return await res.json();
            } catch (e) {
                return { ok: false };
            }
        }

        async function sendLoginOtp() {
            const chatIdInput = document.getElementById('loginChatId').value.trim();
            if (!chatIdInput) { showToast("⚠️ সঠিক Telegram Chat ID দিন!"); return; }

            const btn = document.getElementById('sendCodeBtn');
            btn.innerText = "SENDING CODE...";
            btn.disabled = true;

            const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
            const msg = `🔐 <b>CLOUD PANEL LOGIN</b>\n\n<blockquote>🔑 <b>OTP:</b> <code>${otpCode}</code></blockquote>`;
            const result = await sendTelegramBotMessage(chatIdInput, msg);

            btn.innerText = "SEND VERIFICATION CODE";
            btn.disabled = false;

            if (result && result.ok) {
                generatedLoginOtp = otpCode;
                pendingChatId = chatIdInput;
                document.getElementById('loginStep1').classList.add('hidden');
                document.getElementById('loginStep2').classList.remove('hidden');
                showToast("✅ কোড পাঠানো হয়েছে!");
            } else {
                showToast("❌ কোড পাঠানো যায়নি! বট /start করা আছে কিনা চেক করুন।");
            }
        }

        async function verifyLoginOtp() {
            const entered = document.getElementById('loginOtpInput').value.trim();
            if (entered === generatedLoginOtp && pendingChatId) {
                currentUser = {
                    id: pendingChatId,
                    name: `User (${pendingChatId})`,
                    username: "Web User",
                    photo: `https://ui-avatars.com/api/?name=${pendingChatId}&background=10b981&color=fff`,
                    isMiniApp: false
                };
                localStorage.setItem('ebh_web_user', JSON.stringify(currentUser));
                await initializeCloudSession();
            } else {
                showToast("❌ ভুল ওটিপি কোড!");
            }
        }

        function resetLoginStep() {
            document.getElementById('loginStep2').classList.add('hidden');
            document.getElementById('loginStep1').classList.remove('hidden');
        }

        function logoutUser() {
            if (confirm("লগআউট করতে চান?")) {
                localStorage.removeItem('ebh_web_user');
                location.reload();
            }
        }

        async function forwardOtpToTelegram(item, otpCode) {
            const cInfo = getCountryInfo(item.number);
            const countryStr = `${cInfo.flag} ${cInfo.name} - ${cInfo.short}`;
            const cleanNum = `+${item.number.toString().replace(/\+/g, '')}`;

            const userMsgText = (
                `✅ <b>OTP RECEIVED SUCCESSFULLY!</b>\n\n` +
                `<blockquote>🌍 <b>Country:</b> ${countryStr}</blockquote>\n` +
                `<blockquote>📶 <b>Range:</b> <code>${item.range}</code></blockquote>\n` +
                `<blockquote>📱 <b>Number:</b> <code>${cleanNum}</code></blockquote>\n` +
                `<blockquote>🔑 <b>OTP Code:</b> <code>{otpCode}</code></blockquote>\n`
            ).replace('{otpCode}', otpCode);

            if (currentUser && currentUser.id) {
                await sendTelegramBotMessage(currentUser.id, userMsgText);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;

        // ==================== API KEY GENERATOR & DEVELOPER DOCS VIEW ====================
        async function generateUserApiKey(isRegenerate = false) {
            if (isRegenerate && !confirm("নতুন API Key জেনারেট করলে আগের Key কাজ করা বন্ধ হয়ে যাবে। আপনি কি নিশ্চিত?")) {
                return;
            }
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let randomPart = '';
            for (let i = 0; i < 24; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const newKey = `EBH_${currentUser.id.slice(-4)}_${randomPart}`;
            userCloudData.apiKey = newKey;
            await syncUserToFirebase();
            showToast("✅ নতুন API Key জেনারেট হয়েছে!");
            renderDeveloperDocsView();
        }

            "972": { flag: "🇮🇱", name: "Israel", short: "IL" }, "973": { flag: "🇧🇭", name: "Bahrain", short: "BH" },
            "974": { flag: "🇶🇦", name: "Qatar", short: "QA" }, "975": { flag: "🇧🇹", name: "Bhutan", short: "BT" },
            "976": { flag: "🇲🇳", name: "Mongolia", short: "MN" }, "977": { flag: "🇳🇵", name: "Nepal", short: "NP" },
            "992": { flag: "🇹🇯", name: "Tajikistan", short: "TJ" }, "993": { flag: "🇹🇲", name: "Turkmenistan", short: "TM" },

        };

        const BUTTON_COLORS = ['c-blue', 'c-green', 'c-sky', 'c-purple', 'c-rose', 'c-amber', 'c-teal'];
        function getRandomColor(idx) { return BUTTON_COLORS[idx % BUTTON_COLORS.length]; }

        function getCountryInfo(rangeOrNum) {
            let digits = rangeOrNum.toString().replace(/\D/g, '');
            for (let i = 4; i >= 1; i--) {
                let prefix = digits.substring(0, i);
                if (WORLD_COUNTRIES[prefix]) return WORLD_COUNTRIES[prefix];
            }
            return { flag: "🌐", name: "Global Range", short: "GL" };
        }

        async function loadServices() {
            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-sky-400 mr-2"></i> লোড হচ্ছে...</div>`;

            try {
                const response = await fetch(CONSOLE_API, { headers: { "mauthapi": API_KEY, "Accept": "application/json" } });
                const result = await response.json();
                if(result.meta && result.meta.code === 200) {
                    fetchedConsoleData = result.data.hits || [];
                    let servicesMap = {};
                    fetchedConsoleData.forEach(item => {
                        let sid = item.sid ? item.sid.toUpperCase() : "SMS";
                        if(!servicesMap[sid]) servicesMap[sid] = new Set();
                        servicesMap[sid].add(item.range);
                    });

                    let html = `<div class="glass-panel rounded-2xl p-4 space-y-3 shadow-2xl pb-6">
                                    <h3 class="text-xs font-extrabold text-sky-400 uppercase border-b border-slate-800 pb-2">SELECT SERVICE</h3>
                                    <div class="grid grid-cols-2 gap-2.5">`;
                    Object.keys(servicesMap).forEach((srv, idx) => {
                        html += `<button onclick="loadCountriesForService('${srv}')" class="p-3.5 ${getRandomColor(idx)} active:scale-95 rounded-xl text-xs font-extrabold text-white text-center shadow-md">📱 ${srv}</button>`;
                    });
                    html += `</div></div>`;
                    container.innerHTML = html;
                }
            } catch(e) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400">API এরর!</div>`;
            }
        }

        function loadCountriesForService(serviceName) {
            lastSelectedService = serviceName;
            localStorage.setItem('ebh_last_service', serviceName);

            const container = document.getElementById('screenContainer');
            let countryRanges = {};
            fetchedConsoleData.forEach(item => {
                if(item.sid && item.sid.toUpperCase() === serviceName) {
                    let cInfo = getCountryInfo(item.range);
                    let key = `${cInfo.flag} ${cInfo.name} - ${cInfo.short}`;
                    if(!countryRanges[key]) countryRanges[key] = [];
                    countryRanges[key].push(item.range);
                }
            });

            let html = `<div class="glass-panel rounded-2xl p-4 space-y-3 shadow-2xl pb-6">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <h3 class="text-xs font-extrabold text-amber-400 uppercase">${serviceName} - COUNTRIES</h3>
                                <button onclick="loadServices()" class="text-[10px] font-bold text-white c-rose px-2.5 py-1 rounded-lg">Back</button>
                            </div>
                            <div class="space-y-2">`;

            Object.keys(countryRanges).forEach((cKey, idx) => {
                let rng = countryRanges[cKey][0]; 
                html += `<div onclick="buyTwoNumbers('${rng}', '${serviceName}')" class="p-3 ${getRandomColor(idx+1)} active:scale-95 rounded-xl flex items-center justify-between cursor-pointer shadow-md">
                            <span class="text-xs font-extrabold text-white">${cKey}</span>
                            <span class="text-[10px] font-mono text-white bg-black/30 px-2.5 py-1 rounded-lg font-bold">Get 2 Numbers</span>
                         </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        async function buyTwoNumbers(rangeId, serviceTitle) {
            lastSelectedRange = rangeId;
            lastSelectedService = serviceTitle;
            localStorage.setItem('ebh_last_range', rangeId);
            localStorage.setItem('ebh_last_service', serviceTitle);

            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-emerald-400 mr-2"></i> নতুন নাম্বার জেনারেট হচ্ছে...</div>`;

            let newFetchedNumbers = [];
            for(let i=0; i<2; i++) {
                try {
                    const response = await fetch(BUY_API, {
                        method: "POST",
                        headers: { "mauthapi": API_KEY, "Content-Type": "application/json" },
                        body: JSON.stringify({ range: rangeId })
                    });
                    const resData = await response.json();
                    if(resData.meta && resData.meta.code === 200) {
                        const num = resData.data.full_number || resData.data.national_number;
                        if(num) {
                            newFetchedNumbers.push({
                                id: Date.now() + i,
                                number: "+" + num.toString().replace("+",""),
                                range: rangeId,
                                service: serviceTitle,
                                otp: null,
                                notified: false
                            });
                        }
                    }
                } catch(e) {}
            }

            if(newFetchedNumbers.length > 0) {
                userCloudData.activeNumbers = newFetchedNumbers;
                userCloudData.stats.totalNumbersTaken = (userCloudData.stats.totalNumbersTaken || 0) + newFetchedNumbers.length;
                await syncUserToFirebase();
                renderActiveNumbersView();
            } else {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400 font-bold">এই রেঞ্জে নাম্বার খালি নেই!</div>`;
            }
        }

            if (lastSelectedRange) {

        // ==================== MY OTP CLOUD HISTORY VIEW ====================

            if(myOtps.length === 0) {

                    <div class="glass-panel rounded-2xl p-6 text-center space-y-3 shadow-xl border border-amber-500/30">

        async function deleteOtpItem(itemId) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই ওটিপি হিস্ট্রি থেকে ডিলিট করতে চান?")) {
                userCloudData.successOtps = (userCloudData.successOtps || []).filter(i => i.id !== itemId);
                updateOtpBadge();
                await syncUserToFirebase();
                renderMyOtpView();
                showToast("🗑️ ক্লাউড থেকে ডিলিট করা হয়েছে!");
            }

        async function clearHistory() {
            if(confirm("অ্যাক্টিভ নাম্বারগুলো মুছে ফেলতে চান?")) {
                userCloudData.activeNumbers = [];
                await syncUserToFirebase();
                renderActiveNumbersView();
            }
        }

        // ==================== SUPER FAST REAL-TIME OTP POLLING (1.5s) ====================
        async function pollOtps() {
            if (!currentUser) return;
            try {
                const [statusRes, consoleRes] = await Promise.all([
                    fetch(STATUS_API, { headers: { "mauthapi": API_KEY, "Accept": "application/json" } }).then(r => r.json()).catch(() => ({})),
                    fetch(CONSOLE_API, { headers: { "mauthapi": API_KEY, "Accept": "application/json" } }).then(r => r.json()).catch(() => ({}))
                ]);

                let allSms = [];
                if (statusRes.meta && statusRes.meta.code === 200 && statusRes.data && statusRes.data.otps) {
                    allSms = allSms.concat(statusRes.data.otps);
                }
                if (consoleRes.meta && consoleRes.meta.code === 200 && consoleRes.data && consoleRes.data.hits) {
                    allSms = allSms.concat(consoleRes.data.hits);
                }

                let activeNums = userCloudData.activeNumbers || [];
                let successOtps = userCloudData.successOtps || [];
                let updated = false;

                for (const sms of allSms) {
                    let apiNum = sms.number ? sms.number.toString().replace(/\D/g, "") : "";
                    let msg = sms.message || "";
                    let match = msg.match(/\b\d{4,6}\b/);

                    if (match && apiNum) {
                        let code = match[0];
                        for (const act of activeNums) {
                            let actClean = act.number.toString().replace(/\D/g, "");
                            if ((actClean.includes(apiNum) || apiNum.includes(actClean) || actClean.slice(-7) === apiNum.slice(-7)) && !act.otp) {
                                act.otp = code;
                                updated = true;

                                const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                                const alreadyExists = successOtps.some(h => h.number === act.number && h.otp === code);
                                if (!alreadyExists) {
                                    successOtps.push({
                                        id: 'otp_' + Date.now() + Math.floor(Math.random()*1000),
                                        number: act.number,
                                        service: act.service,
                                        range: act.range,
                                        otp: code,
                                        time: nowTime
                                    });
                                    userCloudData.successOtps = successOtps;
                                    userCloudData.stats.totalSuccessOtps = (userCloudData.stats.totalSuccessOtps || 0) + 1;
                                    updateOtpBadge();
                                }

                                if (!act.notified) {
                                    act.notified = true;
                                    await forwardOtpToTelegram(act, code);
                                }
                            }
                        }
                    }
                }

                if (updated) {
                    userCloudData.activeNumbers = activeNums;
                    await syncUserToFirebase();
                    renderActiveNumbersView();
                }
            } catch (e) {}
        }

                if(result.meta && result.meta.code === 200) {
                    let hits = result.data.hits || [];
                    let html = `<div class="glass-panel rounded-2xl p-4 space-y-2.5 shadow-2xl border border-emerald-500/30 pb-6">

                                    <div class="space-y-2.5">`;
                    
                    hits.slice(-25).reverse().forEach(hit => {
                        let cInfo = getCountryInfo(hit.range);
                        let serviceName = hit.sid ? hit.sid.toUpperCase() : "SMS";
                        let rawRange = hit.range || "N/A";

                        html += `<div class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl space-y-2">
                                    <div class="flex justify-between items-center font-bold text-white">
                                        <span>${cInfo.flag} ${cInfo.name} (${cInfo.short})</span>

                                    </div>

                                        <span class="text-amber-400 font-mono text-[11px]">Range: <b>${rawRange}</b></span>
                                        <button onclick="buyTwoNumbers('${rawRange}', '${serviceName}')" class="px-2.5 py-1 c-green text-white text-[10px] font-extrabold rounded-lg shadow active:scale-95 transition-all">
                                            Get Number <i class="fa-solid fa-arrow-right ml-1"></i>
                                        </button>
                                    </div>
                                    <div class="text-[11px] text-emerald-300 font-mono bg-black/50 p-2.5 rounded-lg border border-slate-800 break-words leading-relaxed">
                                        ${rawMessage}
                                    </div>
                                 </div>`;
                    });
                    html += `</div></div>`;
                    container.innerHTML = html;
                }
            } catch(e) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400">লাইভ ট্রাফিক লোড করতে সমস্যা হয়েছে!</div>`;
            }
        }

        // Super fast polling interval set to 1.5 seconds
        setInterval(pollOtps, 1500);
    </script>
